version: 2.1
parameters:
  run_workflow_sbx:
    default: true
    type: boolean
  run_workflow_stg:
    default: true
    type: boolean
  run_workflow_pro:
    default: true
    type: boolean

jobs:
  sbx:
    docker:
      - image: circleci/buildpack-deps:stretch
    environment:
      IMAGE_NAME: modamigroup/modami-upload-manage-sbx
      ENVIRONMENT: "sbx"
      SERVICE: "upload-manage"
    working_directory: ~/app
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.12
          docker_layer_caching: true
      - run:
          name: Build Docker image
          command: |
            docker build -t $IMAGE_NAME:latest .
      - run:
          name: Push Docker Image
          command: |
            echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker tag $IMAGE_NAME:latest $IMAGE_NAME:$CIRCLE_SHA1
            docker push $IMAGE_NAME:latest
            docker push $IMAGE_NAME:$CIRCLE_SHA1
      - run:
          name: Install envsubst
          command: |
            sudo apt-get update && sudo apt-get -y install gettext-base
      - run:
          name: Update image version
          command: |
            git clone https://cicd-modami:$CIRCLECI_ARGOCD_TOKEN@bitbucket.org/$BITBUCKET_WORKPLACE/modami-kube.git 
            cd modami-kube
            set -e
            COMMIT_SHA1=$CIRCLE_SHA1
            export COMMIT_SHA1=$COMMIT_SHA1
            envsubst <apps/$SERVICE/$ENVIRONMENT/version.patch.yaml >apps/$SERVICE/$ENVIRONMENT/version.yaml.out
            mv apps/$SERVICE/$ENVIRONMENT/version.yaml.out apps/$SERVICE/$ENVIRONMENT/version.yaml
            git config --global user.email "cicd@.vn"
            git config --global user.name "CICD"
            git add -A
            git commit -m 'Updated version to $IMAGE_NAME:$CIRCLE_SHA1 by CICD'
            git push
  stg:
    docker:
      - image: circleci/buildpack-deps:stretch
    environment:
      IMAGE_NAME: modamigroup/modami-upload-manage-stg
      ENVIRONMENT: "stg"
      SERVICE: "upload-manage"
    working_directory: ~/app
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.12
          docker_layer_caching: true
      - run:
          name: Build Docker image
          command: |
            docker build -t $IMAGE_NAME:latest .
      - run:
          name: Push Docker Image
          command: |
            echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker tag $IMAGE_NAME:latest $IMAGE_NAME:$CIRCLE_SHA1
            docker push $IMAGE_NAME:latest
            docker push $IMAGE_NAME:$CIRCLE_SHA1
      - run:
          name: Install envsubst
          command: |
            sudo apt-get update && sudo apt-get -y install gettext-base
      - run:
          name: Update image version
          command: |
            git clone https://cicd-modami:$CIRCLECI_ARGOCD_TOKEN@bitbucket.org/$BITBUCKET_WORKPLACE/modami-kube.git 
            cd modami-kube
            set -e
            COMMIT_SHA1=$CIRCLE_SHA1
            export COMMIT_SHA1=$COMMIT_SHA1
            envsubst <apps/$SERVICE/$ENVIRONMENT/version.patch.yaml >apps/$SERVICE/$ENVIRONMENT/version.yaml.out
            mv apps/$SERVICE/$ENVIRONMENT/version.yaml.out apps/$SERVICE/$ENVIRONMENT/version.yaml
            git config --global user.email "cicd@.vn"
            git config --global user.name "CICD"
            git add -A
            git commit -m 'Updated version to $IMAGE_NAME:$CIRCLE_SHA1 by CICD'
            git push
  pro:
    docker:
      - image: circleci/buildpack-deps:stretch
    environment:
      IMAGE_NAME: modamigroup/modami-upload-manage-pro
      BASE: modami-base
      ENVIRONMENT_BASE: modami-production-base
      LIVE: modami-production-live-upload-manage
      ENVIRONMENT: "pro"
      SERVICE: "upload-manage"
    working_directory: ~/app
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.12
          docker_layer_caching: true
      - run:
          name: Build Docker image
          command: |
            docker build -t $IMAGE_NAME:latest .
      - run:
          name: Push Docker Image
          command: |
            echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker tag $IMAGE_NAME:latest $IMAGE_NAME:$CIRCLE_SHA1
            docker push $IMAGE_NAME:latest
            docker push $IMAGE_NAME:$CIRCLE_SHA1
      - run:
          name: Install envsubst
          command: |
            sudo apt-get update && sudo apt-get -y install gettext-base
      - run:
          name: Install kubectl
          command: |
            curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl
            chmod u+x ./kubectl
      - run:
          name: Pull Kustomize resources
          command: |
            mkdir ~/app/$BASE
            cd ~/app/$BASE
            git clone -b $BASE https://cicd-modami:$CIRCLECI_ARGOCD_TOKEN@bitbucket.org/$BITBUCKET_WORKPLACE/modami-kube.git 
            cp -r modami-kube/* .
            rm -rf modami-kube

            mkdir ~/app/$ENVIRONMENT_BASE
            cd ~/app/$ENVIRONMENT_BASE
            git clone -b $ENVIRONMENT_BASE https://cicd-modami:$CIRCLECI_ARGOCD_TOKEN@bitbucket.org/$BITBUCKET_WORKPLACE/modami-kube.git 
            cp -r modami-kube/* .
            rm -rf modami-kube

            mkdir ~/app/$LIVE
            cd ~/app/$LIVE
            git clone -b $LIVE https://cicd-modami:$CIRCLECI_ARGOCD_TOKEN@bitbucket.org/$BITBUCKET_WORKPLACE/modami-kube.git 
            cp -r modami-kube/* .
            rm -rf modami-kube
      - run:
          name: Update image version
          command: |
            git clone https://cicd-modami:$CIRCLECI_ARGOCD_TOKEN@bitbucket.org/$BITBUCKET_WORKPLACE/modami-kube.git 
            cd modami-kube
            set -e
            COMMIT_SHA1=$CIRCLE_SHA1
            export COMMIT_SHA1=$COMMIT_SHA1
            envsubst <apps/$SERVICE/$ENVIRONMENT/version.patch.yaml >apps/$SERVICE/$ENVIRONMENT/version.yaml.out
            mv apps/$SERVICE/$ENVIRONMENT/version.yaml.out apps/$SERVICE/$ENVIRONMENT/version.yaml
            git config --global user.email "cicd@.vn"
            git config --global user.name "CICD"
            git add -A
            git commit -m 'Updated version to $IMAGE_NAME:$CIRCLE_SHA1 by CICD'
            git push
      - run:
          name: Run Kustomize
          command: |
            cd ~/app/$LIVE
            ~/app/kubectl kustomize ./ > ~/app/result.yaml
      - run:
          name: Deploy Code
          command: |
            chmod +x ./$BASE/ci-deploy.sh
            ./$BASE/ci-deploy.sh
      - run:
          name: View live configuration
          command: |
            cat ~/app/result.yaml

workflows:
  version: 2
  Sandbox:
    when: << pipeline.parameters.run_workflow_sbx >>
    jobs:
      - sbx:
          filters:
            branches:
              only: sandbox
          context:
            - modami-cicd
            - modami-backend-general
            - modami-backend-sbx
  Staging:
    when: << pipeline.parameters.run_workflow_stg >>
    jobs:
      - stg:
          filters:
            branches:
              only: staging
          context:
            - modami-cicd
            - modami-backend-general
            - modami-backend-stg
  Production:
    when: << pipeline.parameters.run_workflow_pro >>
    jobs:
      - pro:
          filters:
            branches:
              only: master
          context:
            - modami-cicd
            - modami-backend-general
            - modami-backend-pro